[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "amazon-ml-worker"
version = "0.1.0"
description = "Reusable ML worker for Amazon ML Challenge 2026"
requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pyarrow>=10.0",
    "pillow>=9.0",
    "opencv-python-headless>=4.6",
    "tqdm>=4.64",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
    "joblib>=1.2",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
cv = [
    "timm>=0.9",
    "torchvision>=0.15",
]
nlp = [
    "transformers>=4.30",
    "tokenizers>=0.13",
    "sentencepiece>=0.1.99",
]
gpu = [
    "torch>=2.0",
    "transformers>=4.30",
    "accelerate>=0.20",
    "peft>=0.4",
    "bitsandbytes>=0.39",
    "datasets>=2.12",
    "trl>=0.4",
    "safetensors>=0.3",
    "sentencepiece>=0.1.99",
]
boost = [
    "lightgbm>=3.3",
    "xgboost>=1.7",
    "catboost>=1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
